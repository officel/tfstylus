name: pre-commit

on:
  pull_request:

jobs:
  pre-commit:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'

      # prek が勝手に古い Go をダウンロードするのを防ぐため、
      # setup-go が入れた最新の Go の実体を prek のツール領域に直接リンクさせます。
      - name: Link setup-go to prek toolchain directory
        env:
          TARGET_GOROOT: ${{ env.GOROOT }}
        run: |
          # 'go version go1.27.1 linux/amd64' から 'go1.27.1' の部分だけを動的に取得
          GO_VERSION=$(go version | awk '{print $3}')

          # prek が参照するフォルダ構造を確実に作成
          mkdir -p "$HOME/.cache/prek/tools/go"

          # setup-go の実体(GOROOT)を、そのバージョン名で prek のキャッシュに直結
          ln -sfn $TARGET_GOROOT "$HOME/.cache/prek/tools/go/$GO_VERSION"

          # 確認用デバッグ（リンクが正しく貼れているか確認）
          ls -la "$HOME/.cache/prek/tools/go"

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461  # v4.1.1
        with:
          aqua_version: 'v2.60.1'

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0

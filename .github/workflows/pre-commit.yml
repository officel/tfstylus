name: pre-commit

on:
  pull_request:

jobs:
  pre-commit:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'

      # prek が勝手に古い Go をダウンロードするのを防ぐため、
      # setup-go が入れた最新の Go の実体を prek のツール領域に直接リンクさせます。
      - name: Link setup-go to prek toolchain directory
        env:
          TARGET_GOROOT: ${{ env.GOROOT }}
        run: |
          # 1. 過去の不整合なキャッシュを物理削除
          rm -rf "$HOME/.cache/prek"

          # 2. .cache から階層を追って確実にディレクトリを作成 (末尾の / を除外)
          mkdir -p "$HOME/.cache"
          mkdir -p "$HOME/.cache/prek"
          mkdir -p "$HOME/.cache/prek/tools"
          mkdir -p "$HOME/.cache/prek/tools/go"

          # 3. 現在の go.mod に紐づく最新 Go の実体だけを 'system' パスに強制マウント
          ln -sfn "$TARGET_GOROOT" "$HOME/.cache/prek/tools/go/system"

          # 4. 念のため動的に取得したバージョン名（go1.27.1等）でもリンクを張る（二重対策）
          GO_VERSION=$(go version | awk '{print $3}')
          ln -sfn "$TARGET_GOROOT" "$HOME/.cache/prek/tools/go/$GO_VERSION"

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461  # v4.1.1
        with:
          aqua_version: 'v2.60.1'

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0

# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  CLI_NAME: tfstylus
  DIR_BIN: "./"

tasks:
  default:
    cmds:
      - echo "This is {{.TASKFILE}} at v{{.TASK_VERSION}}"
      - task --list --sort alphanumeric -t {{.TASKFILE}}
    silent: true

  build:
    desc: Build app
    aliases:
      - b
    cmds:
      - go build -o {{.CLI_NAME}} ./cmd/{{.CLI_NAME}}
      - mv {{.CLI_NAME}} ~/.local/bin/{{.CLI_NAME}}

  clean:
    desc: Clean files
    aliases:
      - c
    cmds:
      - type {{.CLI_NAME}}
      - rm -f ~/.local/bin/{{.CLI_NAME}}
      - type {{.CLI_NAME}}

  test:all:
    desc: Run S + M + L tests
    aliases:
      - ta
    cmds:
      - go test -tags=e2e ./...

  test:c:
    desc: Run tests w/z coverage
    aliases:
      - tc
    cmds:
      - go test -cover ./...

  test:s:
    desc: Run fast tests for commit
    aliases:
      - ts
    cmds:
      - go test -short ./...

  test:m:
    desc: Run S + M tests for PR
    aliases:
      - tm
    cmds:
      - go test ./...

  test:l:
    desc: Run L tests explicitly
    aliases:
      - tl
    cmds:
      - go test -tags=e2e ./...

  test:v:
    desc: "Run tests with verbose output"
    aliases:
      - tv
    cmds:
      - go test -v ./...

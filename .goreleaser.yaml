# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tfstylus

builds:
  - id: "tfstylus"
    binary: tfstylus
    main: ./cmd/tfstylus
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^Merge branch"
      - "^Merge pull request"
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 2

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: tfstylus
    repository:
      owner: officel
      name: homebrew-tap
      # 公開時に専用トークンを設定する。
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/officel/tfstylus
    description: Terraform stylus CLI tool
    license: MIT
    binaries:
      - tfstylus
    # skip_upload: true
